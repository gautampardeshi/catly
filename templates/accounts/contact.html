{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white shadow fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-xl font-bold text-blue-600">Catly</a>
            <div class="space-x-4">
                <a href="{% url 'user:home' %}" class="hover:text-blue-600">Home</a>
            </div>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-28 px-4 py-8 bg-white shadow-md rounded-md">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Contact Us</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Send Message</button>
        </form>
    </div>

</body>
</html>
