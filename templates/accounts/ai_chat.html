<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Chat - Catly</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center">
    <div class="w-full max-w-2xl p-6 bg-white rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-4">💬 Catly AI Chat (Gemini Google)</h1>
        
        <div id="chatbox" class="border border-gray-300 rounded-lg p-4 h-96 overflow-y-auto mb-4 space-y-2 bg-gray-50">
            <!-- Chat messages will appear here -->
        </div>

        <form id="chat-form" class="flex space-x-2">
            <input type="text" id="message" placeholder="Type your message..." required
                class="flex-grow px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <button type="submit"
                class="bg-indigo-600 text-white px-6 py-2 rounded-xl hover:bg-indigo-700 transition">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const chatbox = document.getElementById('chatbox');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const messageInput = document.getElementById('message');
            const message = messageInput.value.trim();
            if (!message) return;

            chatbox.innerHTML += `
                <div class="text-right">
                    <p class="bg-indigo-100 inline-block px-4 py-2 rounded-xl text-indigo-800 font-medium">You: ${message}</p>
                </div>
            `;
            messageInput.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            fetch("", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': '{{ csrf_token }}',
                },
                body: new URLSearchParams({
                    'message': message
                })
            })
            .then(response => response.json())
            .then(data => {
                chatbox.innerHTML += `
                    <div class="text-left">
                        <p class="bg-green-100 inline-block px-4 py-2 rounded-xl text-green-800 font-medium">Gemini: ${data.reply}</p>
                    </div>
                `;
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(() => {
                chatbox.innerHTML += `
                    <div class="text-left">
                        <p class="bg-red-100 inline-block px-4 py-2 rounded-xl text-red-800 font-medium">❌ Error getting response</p>
                    </div>
                `;
                chatbox.scrollTop = chatbox.scrollHeight;
            });
        });
    </script>
</body>
</html>
