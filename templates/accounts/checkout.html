{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Catly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-md">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">🧾 Checkout</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit"
        class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition">
        Proceed to Payment
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-gray-500">OR</p>
    </div>

    <!-- Razorpay Payment Button -->
    <div class="mt-4 text-center">
      <button id="razorpay-payment-button"
        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
        Pay with Razorpay
      </button>
    </div>
  </div>

  <!-- Razorpay Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    var options = {
      key: 'YOUR_RAZORPAY_KEY', // Replace with your Razorpay Key ID
      amount: '10000', // Amount in paise (₹100)
      currency: 'INR',
      name: 'Catly Store',
      description: 'Order Payment',
      handler: function(response) {
        window.location.href = '/payment-success/?order_id=' + response.razorpay_payment_id;
      },
      prefill: {
        name: 'Customer Name',
        email: 'customer@example.com',
        contact: '9876543210'
      },
      theme: {
        color: "#0f172a"
      }
    };

    var rzp1 = new Razorpay(options);
    document.getElementById('razorpay-payment-button').onclick = function(e) {
      rzp1.open();
      e.preventDefault();
    }
  </script>
</body>
</html>
