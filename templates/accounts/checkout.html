{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Checkout | Catly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="max-w-4xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow">
    <h2 class="text-3xl font-bold text-green-600 mb-6">🧾 Checkout</h2>

    <form method="post" id="checkout-form">
      {% csrf_token %}
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" name="first_name" required placeholder="First Name"
               class="p-3 border rounded-lg">
        <input type="text" name="last_name" required placeholder="Last Name"
               class="p-3 border rounded-lg">
        <input type="text" name="phone_number" required placeholder="Phone Number"
               class="p-3 border rounded-lg">
        <input type="email" name="email" required placeholder="Email"
                class="p-3 border rounded-lg">
        <input type="text" name="city" required placeholder="City"
               class="p-3 border rounded-lg">
        <input type="text" name="state" required placeholder="State"
               class="p-3 border rounded-lg">
        <input type="text" name="zip_code" required placeholder="ZIP Code"
               class="p-3 border rounded-lg">
        <textarea name="address" required placeholder="Address"
                  class="md:col-span-2 p-3 border rounded-lg"></textarea>
      </div>

      <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">

      <button type="button" id="razorpay-payment-button"
              class="mt-6 w-full py-4 bg-green-600 text-white rounded-xl text-lg font-semibold hover:bg-green-700">
        💳 Pay ₹{{ total_price }} with Razorpay
      </button>
    </form>
  </div>

  <!-- Razorpay Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var options = {
        key: "{{ razorpay_key }}",
        amount: "{{ total_amount_in_paise }}",
        currency: "INR",
        name: "Catly Store",
        description: "Secure Payment",
        order_id: "{{ razorpay_order_id }}",
        handler: function (response) {
          document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
          document.getElementById('checkout-form').submit();
        },
        prefill: {
          name: "{{ request.user.get_full_name }}",
          email: "{{ request.user.email }}",
          contact: "9999999999"
        },
        theme: {
          color: "#10b981"
        }
      };

      var rzp = new Razorpay(options);
      document.getElementById('razorpay-payment-button').onclick = function (e) {
        rzp.open();
        e.preventDefault();
      };
    });
  </script>

</body>
</html>
