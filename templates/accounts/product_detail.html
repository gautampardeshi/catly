<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ product.name }} | Vital Care</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 to-blue-200 min-h-screen">

  <div class="container mx-auto p-4">
    <div class="flex justify-center">
      <div class="w-full md:w-1/2 lg:w-1/3 bg-white p-6 rounded-lg shadow-lg">
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-64 object-cover mb-4 rounded-md">
        
        <h2 class="text-2xl font-bold text-gray-800">{{ product.name }}</h2>
        <p class="text-gray-600 mt-2">{{ product.description }}</p>
        
        <div class="mt-4 flex justify-between items-center">
          <div class="text-xl font-semibold text-blue-600">₹{{ product.price }}</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
