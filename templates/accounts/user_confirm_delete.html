<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
    {% comment %} {% extends "accounts/admin_dashboard.html" %} {% endcomment %}
    {% block content %}
    <div class="p-6 max-w-lg mx-auto bg-white rounded-lg shadow-lg">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Delete User</h2>
        <p class="text-gray-600 mb-4">Are you sure you want to delete the user <strong class="text-red-600">{{ object.username }}</strong>?</p>
        <p class="text-sm text-gray-500 mb-6">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-4">
                <button type="submit" class="bg-red-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50">
                    Confirm Delete
                </button>
                <a href="{% url 'user:user_list' %}" class="text-blue-600 hover:underline">Cancel</a>
            </div>
        </form>
    </div>
    {% endblock %}
</body>

</html>
